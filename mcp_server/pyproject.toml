[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe_mcp_server"]

[project]
name = "loupe_mcp_server"
version = "0.1.0"
description = "FastAPI/MCP server wiring loupe_core into a running service Claude Code can connect to"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    # Pinned exactly, both of these: fastapi-mcp declares mcp>=1.12.0 with no
    # ceiling of its own, so an unpinned mcp resolves to whatever's newest at
    # install time -- a real break found by CI's fresh install, not a local
    # dev venv's install history: a newer mcp release changed the internal
    # `Server()` constructor's signature, which fastapi-mcp 0.4.0's own
    # setup_server() calls positionally, raising a TypeError at import time.
    # This exact pair is the one this codebase is actually built and tested
    # against.
    "fastapi-mcp==0.4.0",
    "mcp==1.28.1",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]
# loupe_core is not published anywhere pip can resolve a bare name from — it's
# installed separately, editable, from ../core into the same venv (see
# scripts/setup_dev.sh). Standard pattern for a plain-pip monorepo with no
# extra tooling (uv/Poetry workspaces) adopted.
#
# No [project.scripts] here — the `loupe` command lives in the standalone
# cli/ package (docs/PhaseX/MASTER_ROADMAP.md's restructure decision), which
# depends on this package rather than containing it.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
